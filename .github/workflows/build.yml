name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decomprimi il progetto
        run: unzip -q HtcClockWidget.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compila
        working-directory: HtcClockWidget
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HtcClockWidget-apk
          path: HtcClockWidget/app/build/outputs/apk/debug/app-debug.apk
